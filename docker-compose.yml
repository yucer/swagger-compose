services:

  swagger-editor:
    image: swaggerapi/swagger-editor
    container_name: swagger-editor
    ports:
      - 127.0.0.1:8080:8080
    environment:
      - URL_SWAGGER2_GENERATOR=http://127.0.0.1:8081/api/swagger.json
      - URL_OAS3_GENERATOR=null
      - URL_SWAGGER2_CONVERTER=null

  swagger-generator:
    image: swaggerapi/swagger-generator
    container_name: swagger-generator
    environment:
      - GENERATOR_HOST=http://127.0.0.1:8081
    ports:
      - 127.0.0.1:8081:8080
